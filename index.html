<!DOCTYPE html>
<html>
    <head>
        <title>Nishant Maurya Portfolio</title>
        <style>
            *{
                padding:0;
                margin:0;
                font-size: 20px;
                background-color: rgb(25, 25, 142);
            }
            .chome{
                border: 0px solid black;
                border-radius: 12px;
                width: 50%;
                height: auto;
                padding: 45px 20px;
                margin: 100px 0px;
                background-color:rgb(15, 15, 209);
                color: white;
                font-size: 25px;
                box-shadow: 5px 5px 4px #0303ff;
            }
            .form-box {
                margin: auto;
                width: 380px;
                border-radius: 10px;
                box-shadow: 5px 5px 4px #0303ff; ;
            }
            input{
                width: 100%;
                height: 30px;
                background-color: #0303ff;
                color: black;
            }
            input::placeholder{
                color: rgb(252, 249, 249);
            }
            
            /* Navigation Css */
            ul{
                background-color: #edbf09;
                list-style-type: none;
                overflow: hidden;
                display: block;
                position: fixed;
                top: 0;
                width: 100%;
            }
            li{
                background-color:#edbf09 ;
                float: left;
                padding: 15px;
                margin: 3px;
            }
            li a{
                background-color: #edbf09;
                text-decoration: none;
                display: inline-block;
                font-size: 22px;
                color: rgb(12, 0, 0);
            }
        </style>
    </head>
    <body>
        <!-- Navigation Bar Html with Bookmark -->
        <div>
            <ul>
                <li><a href="#home" target="_self">Home</a></li>
                <li><a href="#about" target="_self">About</a></li>
                <li><a href="#skills" target="_self">Skills</a></li>
                <li><a href="#projects" target="_self">Project</a></li>
                <li><a href="#contack" target="_self">Contact</a></li>
            </ul>
        </div>
        <p class="chome" id="home">
            Hii, I'm Nishant<br>
            Bsc Computer Science Student<br>
            Aspiring Full-Stack Developer
        </p>
        <p class="chome" id="about">
            I am a Bsc Computer Science Student interest in <br>
            Web Development and full-stack Development.
        </p>
        <p class="chome" id="skills">
            HTML , CSS , Javascript , Git & Github , Excel
        </p>
        <div class="form-box">
            <form class="settle">
                <input type="text" name="fullName" placeholder="Enter Your FullName" autofocus><br>
                <input type="text" name="address" placeholder="Enter your Address"><br>
                <input type="tel" name="phoneNo" placeholder="Enter Your Phone No."><br>
                <input type="email" name="email" placeholder="Enter Your Email"><br>
                <textarea style="width: 382px; background-color: #0303ff;">Any Message</textarea><br>
                <input type="submit" value="submit">
            </form>
        </div>
    </body>
</html>
